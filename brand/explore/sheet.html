<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#141416;font-family:ui-monospace,monospace;color:#9ba1a8;padding:26px}
.row{display:flex;align-items:flex-end;gap:26px;margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid #26282c}
.lbl{width:26px;font-size:20px;color:#e6e8ea}
figure{margin:0;text-align:center}figcaption{font-size:11px;margin-top:7px}
img{display:block;image-rendering:auto}
</style></head><body>
<div class="row"><div class="lbl">A</div>
<figure><img src="a.svg" width="16" height="16"><figcaption>16</figcaption></figure>
<figure><img src="a.svg" width="32" height="32"><figcaption>32</figcaption></figure>
<figure><img src="a.svg" width="64" height="64"><figcaption>64</figcaption></figure>
<figure><img src="a.svg" width="160" height="160"><figcaption>160</figcaption></figure></div>
<div class="row"><div class="lbl">B</div>
<figure><img src="b.svg" width="16" height="16"><figcaption>16</figcaption></figure>
<figure><img src="b.svg" width="32" height="32"><figcaption>32</figcaption></figure>
<figure><img src="b.svg" width="64" height="64"><figcaption>64</figcaption></figure>
<figure><img src="b.svg" width="160" height="160"><figcaption>160</figcaption></figure></div>
<div class="row"><div class="lbl">C</div>
<figure><img src="c.svg" width="16" height="16"><figcaption>16</figcaption></figure>
<figure><img src="c.svg" width="32" height="32"><figcaption>32</figcaption></figure>
<figure><img src="c.svg" width="64" height="64"><figcaption>64</figcaption></figure>
<figure><img src="c.svg" width="160" height="160"><figcaption>160</figcaption></figure></div>
</body></html>
